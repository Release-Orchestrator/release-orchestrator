apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 3
  strategy:
    canary:
      canaryMetadata:
        labels:
          rollout: canary
      stableMetadata:
        labels:
          rollout: stable
      steps:
        - setWeight: 10
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: success-rate
                args:
                  - name: service-name
                    value: api-gateway
                  - name: namespace
                    value: production
              - templateName: latency-p99
                args:
                  - name: service-name
                    value: api-gateway
                  - name: namespace
                    value: production
              - templateName: error-rate
                args:
                  - name: service-name
                    value: api-gateway
                  - name: namespace
                    value: production
        - setWeight: 30
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: success-rate
                args:
                  - name: service-name
                    value: api-gateway
                  - name: namespace
                    value: production
              - templateName: latency-p99
                args:
                  - name: service-name
                    value: api-gateway
                  - name: namespace
                    value: production
              - templateName: error-rate
                args:
                  - name: service-name
                    value: api-gateway
                  - name: namespace
                    value: production
        - setWeight: 50
        - pause: {duration: 60s}
        - setWeight: 100
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api-gateway
          image: ghcr.io/release-orchestrator/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: USER_SERVICE_URL
              value: "http://user-service:8080"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8080"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8080"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8080"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi