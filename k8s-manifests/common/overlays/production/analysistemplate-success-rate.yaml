apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: production
spec:
  args:
    - name: service-name
    - name: namespace
  metrics:
    - name: success-rate
      interval: 30s
      count: 5
      successCondition: result[0] >= 0.99
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{app="{{args.service-name}}",namespace="{{args.namespace}}",code=~"2.."}[2m]))
            /
            sum(rate(http_requests_total{app="{{args.service-name}}",namespace="{{args.namespace}}"}[2m]))