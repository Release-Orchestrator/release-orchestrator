apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 3
  strategy:
    canary:
      canaryMetadata:
        labels:
          rollout: canary
      stableMetadata:
        labels:
          rollout: stable
      steps:
        - setWeight: 10
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: success-rate
                args:
                  - name: service-name
                    value: payment-service
                  - name: namespace
                    value: production
              - templateName: latency-p99
                args:
                  - name: service-name
                    value: payment-service
                  - name: namespace
                    value: production
              - templateName: error-rate
                args:
                  - name: service-name
                    value: payment-service
                  - name: namespace
                    value: production
        - setWeight: 30
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: success-rate
                args:
                  - name: service-name
                    value: payment-service
                  - name: namespace
                    value: production
              - templateName: latency-p99
                args:
                  - name: service-name
                    value: payment-service
                  - name: namespace
                    value: production
              - templateName: error-rate
                args:
                  - name: service-name
                    value: payment-service
                  - name: namespace
                    value: production
        - setWeight: 50
        - pause: {duration: 60s}
        - setWeight: 100
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: payment-service
          image: ghcr.io/release-orchestrator/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: "payment-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASS
              value: "postgres"
            - name: DB_NAME
              value: "payment_db"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi