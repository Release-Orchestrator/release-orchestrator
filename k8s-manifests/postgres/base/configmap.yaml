apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
data:
  init.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE DATABASE user_db;
      CREATE DATABASE auth_db;
      CREATE DATABASE order_db;
      CREATE DATABASE payment_db;
    EOSQL
