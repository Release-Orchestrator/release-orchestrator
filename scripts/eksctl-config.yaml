apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: release-orch
  region: ap-south-2
  version: "1.31"

iam:
  withOIDC: true

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver

managedNodeGroups:
  - name: standard-nodes
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
    labels:
      nodegroup: standard-nodes