apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: release-orch
  region: ap-south-2
  version: "1.33"

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]

managedNodeGroups:
  - name: standard-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    ssh:
      allow: false
    labels:
      nodegroup: standard-nodes