apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: release-platform
  region: ap-south-1
  version: "1.33"

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]

managedNodeGroups:
  - name: release-platform-ng
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 20
    ssh:
      allow: false
    labels:
      nodegroup: release-platform-ng
